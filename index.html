<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Itthikon Sakumkaew — Full-Stack Developer portfolio" />
    <title>Itthikon Sakumkaew | Portfolio</title>
    <link rel="icon" type="image/png" href="/images/ipod1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pridi:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script>
      // Desktop layout is designed for a ~1900×900 viewport; smaller screens get the whole page scaled
      // down (like browser zoom-out) so every page fits one screen. --z lets CSS undo the zoom on
      // viewport units and canvases.
      (function () {
        var root = document.documentElement;
        var fit = function () {
          var w = window.innerWidth;
          var h = window.innerHeight;
          var z = w <= 1024 ? 1 : Math.max(0.55, Math.min(1, w / 1900, h / 900));
          root.style.zoom = z === 1 ? '' : String(z);
          root.style.setProperty('--z', String(z));
        };
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
